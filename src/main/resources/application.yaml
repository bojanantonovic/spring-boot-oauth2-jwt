spring:
  application:
    name: spring-boot-oauth2-jwt
  datasource:
    url: jdbc:h2:mem:spring-boot-oauth2-jwt
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

app:
  jwt:
    secret: "5367566B59703373367639792F423F4528482B4D6251655468576D5A713474"
    issuer: http://localhost:8080
    expiration-ms: 3600000
  cors:
    allowed-origins: http://localhost:4200
